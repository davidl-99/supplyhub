name: Backend CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yaml"

  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: supplyhub_test
          POSTGRES_USER: supplyhub
          POSTGRES_PASSWORD: supplyhub_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U supplyhub -d supplyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: supplyhub_test
      TEST_POSTGRES_USER: supplyhub
      TEST_POSTGRES_PASSWORD: supplyhub_test_password

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Check types with Mypy
        run: python -m mypy app

      - name: Run tests
        run: python -m pytest
